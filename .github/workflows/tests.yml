name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repo hygiene (tracked scratch and credential files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject tracked scratch files
        run: |
          set -euo pipefail
          offenders=$(git ls-files | grep -E '(^|/)(apps\.json.*|.*\.tmp|.*\.log|\.env.*|secrets\.ya?ml)$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::scratch or secret files are tracked in git; untrack them and extend .gitignore:"
            echo "$offenders"
            exit 1
          fi
      - name: Reject tracked report artifacts
        run: |
          set -euo pipefail
          offenders=$(git ls-files | grep -E '(^|/)([^/]*-[Rr]eport\.md|THREAT-MODEL\.md|implementation_plan\.md)$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::review and analysis artifacts are tracked; keep them in the working copy, not in history:"
            echo "$offenders"
            exit 1
          fi
      - name: Reject committed Supervisor credentials
        run: |
          set -euo pipefail
          # This workflow contains the pattern below, so it is excluded from the scan.
          if git grep -n -I -F '"ingress_token"' -- . ':(exclude).github/workflows/tests.yml'; then
            echo "::error::Supervisor ingress credentials are committed; remove the file, rotate the tokens, and purge history"
            exit 1
          fi

  bridge-unit:
    name: Bridge unit / API (L1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/bridge
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-test.txt
      - name: Run bridge regression suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests -q

  integration-unit:
    name: Integration client unit (L1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/integration
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install client test dependencies
        # voluptuous is imported by config_flow.py, so the endpoint tests that
        # drive it need it even without the Home Assistant runtime.
        run: python -m pip install --disable-pip-version-check aiohttp pytest pytest-asyncio voluptuous
      - name: Run client unit tests (no HA runtime required)
        run: python -m pytest tests/unit tests/test_package_layout.py -q -p asyncio --asyncio-mode=auto

  integration-sil:
    name: HA integration SIL (L2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/integration
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          # pytest-homeassistant-custom-component >= 0.13.317 requires Python >= 3.14
          # (matches the local dev venv, which runs 0.13.366 on CPython 3.14)
          python-version: "3.14"
      - name: Install pinned HA Core SIL dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-sil.txt
      - name: Run Home Assistant SIL suite
        env:
          BLHAOS_RUN_SIL: "1"
        run: python -m pytest tests/test_ha_integration_sil.py -q -p asyncio --asyncio-mode=auto

  frontend:
    name: Frontend unit + build + E2E (L3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/bridge/web_ui
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          # The E2E webServer boots the FastAPI backend in demo mode
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install backend dependencies (for the E2E webServer)
        run: python -m pip install --disable-pip-version-check -r ../backend/requirements-test.txt
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Unit tests (vitest)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (demo-mode backend)
        run: npm run test:e2e
