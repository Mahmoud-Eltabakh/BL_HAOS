version: "3"

services:
  haos:
    image: qemux/qemu
    container_name: haos_vm
    cap_add:
      - NET_ADMIN
    environment:
      - BOOT=https://github.com/home-assistant/operating-system/releases/download/12.4/haos_ova-12.4.qcow2.xz
      - DISK_SIZE=32G
      - RAM_SIZE=2G
      - USER_PORTS=8123,22222
      # Mount the CONFIG usb drive to provision SSH keys via virtual virtio drive
      - ARGUMENTS=-drive file=/config_usb/config.img,format=raw,if=virtio
    volumes:
      - ./config_usb:/config_usb
    devices:
      - /dev/kvm
    ports:
      - "8123:8123"
      - "22222:22222" # Supervisor Host SSH port

  test-runner:
    build: 
      context: .
      dockerfile: Dockerfile.test
    container_name: bl_haos_test_runner
    depends_on:
      - haos
    environment:
      - HAOS_HOST=haos
      - HAOS_SSH_PORT=22222
      - HA_URL=http://haos:8123
    volumes:
      - ../../:/workspace
      - ./config_usb:/config_usb
      - ./reports:/reports
    command: ["sh", "/workspace/tests/integration/scripts/run-sil-tests.sh"]
